<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石榴籽足迹 · 交互原型</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #F6F4EE;
    --paper: #FFFFFF;
    --ink: #22211E;
    --ink2: #6B6961;
    --line: #E4E1D7;
    --gold: #A9743C;
    --gold-l: #F3E8D6;
    --green: #4E7B62;
    --green-l: #E8F0EA;
    --plum: #6C5CA8;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* ---------- 顶栏 ---------- */
  .top {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; background: rgba(246,244,238,.94);
    border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .brand { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  .brand small { font-weight: 400; font-size: 12px; color: var(--ink2); margin-left: 8px; letter-spacing: 0; }
  .progress { margin-left: auto; font-size: 13px; color: var(--ink2); display: flex; align-items: center; gap: 10px; }
  .progress b { color: var(--gold); font-weight: 600; }
  .reset { font-size: 12px; color: var(--ink2); background: none; border: 1px solid var(--line); padding: 5px 12px; border-radius: 14px; }
  .reset:hover { border-color: var(--ink2); color: var(--ink); }

  .wrap { max-width: 960px; margin: 0 auto; padding: 26px 22px 60px; }
  .screen { display: none; animation: fade .28s ease; }
  .screen.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- 第一层：地图 ---------- */
  .maphead { text-align: center; margin-bottom: 18px; }
  .maphead h1 { font-size: 21px; font-weight: 600; letter-spacing: 1px; }
  .maphead p { font-size: 13px; color: var(--ink2); margin-top: 6px; }

  .mapbox {
    position: relative; height: 430px; border-radius: 14px;
    background: #FBF9F3; border: 1px solid var(--line);
    background-image:
      linear-gradient(#EDE9DE 1px, transparent 1px),
      linear-gradient(90deg, #EDE9DE 1px, transparent 1px);
    background-size: 44px 44px;
    overflow: hidden;
  }
  .region {
    position: absolute; font-size: 12px; color: #C9C4B4; letter-spacing: 4px;
    user-select: none; pointer-events: none;
  }
  .dot {
    position: absolute; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; padding: 0;
  }
  .dot i {
    display: block; width: 15px; height: 15px; border-radius: 50%;
    background: #FFFFFF; border: 2px solid var(--gold);
    transition: all .25s;
  }
  .dot span { font-size: 11.5px; color: var(--ink2); white-space: nowrap; transition: color .25s; }
  .dot:hover i { transform: scale(1.35); }
  .dot:hover span { color: var(--ink); }
  .dot.lit i { background: var(--gold); box-shadow: 0 0 0 5px rgba(169,116,60,.16); }
  .dot.lit span { color: var(--gold); font-weight: 600; }
  .mapnote { margin-top: 12px; font-size: 11.5px; color: #9C988A; text-align: center; }

  /* ---------- 第二层：详情 ---------- */
  .back { font-size: 13px; color: var(--ink2); background: none; padding: 4px 0; margin-bottom: 16px; }
  .back:hover { color: var(--ink); }
  .dtitle { font-size: 24px; font-weight: 600; letter-spacing: .5px; }
  .dsub { font-size: 13px; color: var(--gold); margin-top: 6px; letter-spacing: 1px; }
  .dintro { font-size: 15px; color: #3B3934; margin-top: 16px; line-height: 1.9; max-width: 620px; }

  .costume { margin-top: 24px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 20px 22px; display: flex; gap: 22px; align-items: center; }
  .costume .fig {
    width: 96px; height: 116px; flex: none; border-radius: 10px;
    background: var(--gold-l); position: relative; overflow: hidden;
  }
  .costume .fig::before {
    content: ""; position: absolute; left: 50%; top: 16px; width: 26px; height: 26px;
    margin-left: -13px; border-radius: 50%; background: #C8A276;
  }
  .costume .fig::after {
    content: ""; position: absolute; left: 50%; top: 46px; width: 54px; height: 58px;
    margin-left: -27px; border-radius: 22px 22px 6px 6px; background: #B98A5E;
    box-shadow: inset 0 14px 0 #E9C77E, inset 0 26px 0 #8F5B45;
  }
  .costume h3 { font-size: 15px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 9px 0 8px; }
  .chips em { font-style: normal; font-size: 12px; background: #F6F2E8; border: 1px solid #EADFC8; color: #6B5330; padding: 3px 10px; border-radius: 12px; }
  .costume p { font-size: 12.5px; color: var(--ink2); }

  .actions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
  .btn {
    font-size: 14px; padding: 12px 26px; border-radius: 24px; background: var(--gold); color: #fff;
    letter-spacing: .5px; transition: .2s;
  }
  .btn:hover { background: #8F5F2E; }
  .btn.ghost { background: none; color: var(--ink2); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--ink2); color: var(--ink); background: none; }

  /* ---------- 第二层：迁徙与融合 ---------- */
  .sec { margin-top: 26px; }
  .sec-h { font-size: 13px; color: var(--ink2); letter-spacing: 1.5px; margin-bottom: 12px; }
  .video {
    position: relative; height: 190px; border-radius: 12px; background: #2C2A26;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .video .play { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.5); color: #fff; font-size: 16px; }
  .video .cap { position: absolute; left: 20px; bottom: 16px; right: 20px; color: #E8E4DA; font-size: 13px; }
  .sandbox { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 16px; }
  .sandbox svg { display: block; width: 100%; height: 180px; }
  .sandbox .cap2 { font-size: 12.5px; color: var(--ink2); margin-top: 8px; text-align: center; }
  .comic { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel .pic { height: 96px; background: #F2EEE3; position: relative; }
  .panel .pic::before { content: ""; position: absolute; left: 16px; right: 16px; bottom: 14px; height: 34px; background: #D9CBB2; border-radius: 4px; }
  .panel .pic::after { content: ""; position: absolute; left: 28px; top: 18px; width: 22px; height: 22px; border-radius: 50%; background: #C8A276; }
  .panel .txt { padding: 12px 14px; font-size: 12.5px; color: #4A4842; line-height: 1.65; }
  .panel .num { font-size: 11px; color: var(--gold); letter-spacing: 1px; }

  /* ---------- 第三层：第一人称沉浸 ---------- */
  .scene {
    position: relative; height: 520px; border-radius: 14px; overflow: hidden;
    background: #EFEAE0; cursor: crosshair;
  }
  .layer { position: absolute; inset: -8% -8%; transition: transform .18s ease-out; will-change: transform; }
  .l-far { background: #E3E9E2; }
  .l-far .hill { position: absolute; border-radius: 50% 50% 0 0; background: #D2DDD2; }
  .l-mid { background: transparent; }
  .l-mid .house { position: absolute; background: #C6B79B; border-radius: 3px 3px 0 0; }
  .l-mid .roof { position: absolute; width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 24px solid #A98D66; }
  .l-near { background: transparent; }
  .l-near .ground { position: absolute; left: -10%; right: -10%; bottom: -10%; height: 42%; background: #B9C6B2; border-radius: 46% 46% 0 0; }
  .l-near .grass { position: absolute; bottom: 24%; width: 3px; height: 26px; background: #8FA383; border-radius: 2px; }
  .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 90px rgba(60,55,45,.22); }
  .reticle { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.7); pointer-events: none; }

  .hotspot {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    background: rgba(255,255,255,.78); border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--gold);
    animation: pulse 2s infinite; opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .hotspot.show { opacity: 1; pointer-events: auto; }
  .hotspot.done { background: var(--gold); color: #fff; animation: none; opacity: .85; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(169,116,60,.35); } 50% { box-shadow: 0 0 0 9px rgba(169,116,60,0); } }

  .npcbar { position: absolute; left: 24px; right: 24px; bottom: 22px; display: flex; align-items: flex-end; gap: 14px; }
  .npc {
    width: 52px; height: 52px; flex: none; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #F6C9A8, #A93F26 72%);
    box-shadow: 0 0 0 4px rgba(255,255,255,.55), 0 0 0 9px rgba(169,116,60,.16);
    position: relative; animation: breathe 3.2s ease-in-out infinite;
  }
  .npc::after { content: ""; position: absolute; left: 50%; top: 30%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: rgba(255,255,255,.85); }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .bubble {
    flex: 1; background: rgba(255,255,255,.96); border-radius: 14px; padding: 16px 20px 14px;
    border: 1px solid rgba(0,0,0,.05);
  }
  .bubble .who { font-size: 11px; color: var(--gold); letter-spacing: 1.5px; margin-bottom: 4px; }
  .bubble .say { font-size: 14.5px; line-height: 1.7; color: #2B2A26; min-height: 44px; }
  .bubble .foot { display: flex; justify-content: flex-end; margin-top: 6px; }
  .bubble .next { font-size: 12.5px; color: #fff; background: var(--gold); padding: 6px 18px; border-radius: 16px; }

  .tipcard {
    position: absolute; left: 50%; top: 26px; transform: translateX(-50%);
    width: min(400px, calc(100% - 48px)); background: rgba(255,255,255,.97); border-radius: 12px;
    padding: 16px 20px; box-shadow: 0 8px 30px rgba(0,0,0,.12); display: none;
  }
  .tipcard.on { display: block; }
  .tipcard h4 { font-size: 13.5px; font-weight: 600; color: var(--gold); margin-bottom: 6px; }
  .tipcard p { font-size: 13px; color: #3B3934; line-height: 1.7; }

  /* ---------- 答题 ---------- */
  .modal { position: fixed; inset: 0; background: rgba(30,28,24,.42); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 100; }
  .modal.on { display: flex; }
  .card { background: var(--paper); border-radius: 16px; padding: 30px 32px; width: min(480px, 100%); }
  .card .kicker { font-size: 11px; letter-spacing: 2px; color: var(--gold); }
  .card h3 { font-size: 17px; font-weight: 600; margin: 10px 0 18px; line-height: 1.6; }
  .opt {
    display: block; width: 100%; text-align: left; font-size: 14px; line-height: 1.6;
    padding: 14px 18px; border: 1px solid var(--line); border-radius: 10px; background: #FCFBF7;
    margin-bottom: 10px; color: #2E2C28; transition: .18s;
  }
  .opt:hover { border-color: var(--gold); background: #FBF6EC; }
  .opt.right { border-color: var(--green); background: var(--green-l); }
  .opt.wrong { border-color: #C46A5A; background: #FAEDEA; }
  .fb { font-size: 13px; color: var(--ink2); line-height: 1.7; margin-top: 8px; display: none; }
  .fb.on { display: block; }
  .fb b { color: var(--green); }

  .done { text-align: center; padding: 60px 20px; }
  .done h2 { font-size: 22px; font-weight: 600; }
  .done p { font-size: 14px; color: var(--ink2); margin-top: 12px; }

  @media (max-width: 720px) {
    .mapbox { height: 380px; }
    .comic { grid-template-columns: 1fr; }
    .scene { height: 440px; }
    .costume { flex-direction: column; align-items: flex-start; }
    .npcbar { left: 14px; right: 14px; }
    .bubble .say { font-size: 13.5px; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">石榴籽足迹<small>交互原型 · 三层内容</small></div>
  <div class="progress"><span>已点亮 <b id="pg">0</b> / <span id="tt">8</span></span><button class="reset" onclick="resetAll()">重置</button></div>
</div>

<div class="wrap">

  <!-- ========== 第一层：地图 ========== -->
  <section id="s-map" class="screen on">
    <div class="maphead">
      <h1>点一张地图，走进十二个地方</h1>
      <p>点亮一个点，看那里的服饰、走过那里的路、听那里的故事</p>
    </div>
    <div class="mapbox" id="map"></div>
    <p class="mapnote">示意布局，用于原型演示。正式版须使用自然资源部标准地图底图（含审图号）。</p>
  </section>

  <!-- ========== 第一层：详情 ========== -->
  <section id="s-detail" class="screen">
    <button class="back" onclick="go('s-map')">← 返回地图</button>
    <div class="dtitle" id="d-name"></div>
    <div class="dsub" id="d-theme"></div>
    <p class="dintro" id="d-intro"></p>
    <div class="costume" id="d-costume"></div>
    <div class="actions">
      <button class="btn" onclick="startImmersive()">进入第一人称体验 →</button>
      <button class="btn ghost" onclick="openHistory()">看迁徙与融合</button>
    </div>
  </section>

  <!-- ========== 第二层：迁徙与融合 ========== -->
  <section id="s-history" class="screen">
    <button class="back" onclick="go('s-detail')">← 返回</button>
    <div class="dtitle" id="h-name"></div>
    <div class="dsub">迁徙与融合 · 一段历史，三种讲法</div>

    <div class="sec">
      <div class="sec-h">其一 · 影像</div>
      <div class="video">
        <button class="play" onclick="toast('视频为占位，正式版替换为 2–3 分钟短片')">▶</button>
        <div class="cap" id="h-video"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">其二 · 数字沙盘</div>
      <div class="sandbox">
        <svg id="h-sand" viewBox="0 0 340 180" preserveAspectRatio="none"></svg>
        <p class="cap2" id="h-sandcap"></p>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h">其三 · 漫画</div>
      <div class="comic" id="h-comic"></div>
    </div>

    <div class="actions">
      <button class="btn" onclick="startImmersive()">进入第一人称体验 →</button>
    </div>
  </section>

  <!-- ========== 第三层：第一人称 ========== -->
  <section id="s-imm" class="screen">
    <button class="back" onclick="go('s-detail')" style="margin-bottom:12px">← 退出体验</button>
    <div class="scene" id="scene">
      <div class="layer l-far" id="l-far">
        <div class="hill" style="left:4%; top:34%; width:56%; height:70%"></div>
        <div class="hill" style="left:44%; top:22%; width:64%; height:82%"></div>
      </div>
      <div class="layer l-mid" id="l-mid">
        <div class="house" style="left:16%; top:52%; width:70px; height:56px"></div>
        <div class="roof" style="left:14%; top:40%"></div>
        <div class="house" style="left:62%; top:56%; width:56px; height:48px"></div>
        <div class="roof" style="left:60%; top:45%; border-left-width:30px; border-right-width:30px"></div>
      </div>
      <div class="layer l-near" id="l-near">
        <div class="ground"></div>
        <div class="grass" style="left:14%"></div>
        <div class="grass" style="left:22%; height:34px"></div>
        <div class="grass" style="left:70%"></div>
        <div class="grass" style="left:82%; height:30px"></div>
      </div>
      <div class="vignette"></div>
      <div class="reticle"></div>
      <div class="tipcard" id="tip"><h4></h4><p></p></div>
      <div class="npcbar">
        <div class="npc"></div>
        <div class="bubble">
          <div class="who">阿籽 · 向导</div>
          <div class="say" id="say"></div>
          <div class="foot"><button class="next" id="nextBtn" onclick="nextLine()">下一句</button></div>
        </div>
      </div>
    </div>
    <p class="mapnote" style="margin-top:10px">移动鼠标或手指，画面会产生纵深变化 · 讲解结束后点亮场景里的圆圈</p>
  </section>

  <!-- ========== 完成 ========== -->
  <section id="s-done" class="screen">
    <div class="done">
      <h2>十二点尚未集满，先把这一处走完</h2>
      <p>回到地图，继续点亮其他地方。</p>
      <div class="actions" style="justify-content:center"><button class="btn" onclick="go('s-map')">回到地图</button></div>
    </div>
  </section>

</div>

<!-- 答题弹层 -->
<div class="modal" id="modal">
  <div class="card">
    <div class="kicker">点睛一问</div>
    <h3 id="q-text"></h3>
    <div id="q-opts"></div>
    <div class="fb" id="q-fb"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
  var cur = null, lineIdx = 0, seen = 0, lit = [], tips = [];
  var KEY = 'shiliuzi_lit';

  try { lit = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { lit = []; }

  /* ---------- 通用 ---------- */
  function go(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function toast(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#2C2A26;color:#fff;font-size:13px;padding:10px 20px;border-radius:20px;z-index:200;opacity:0;transition:.3s';
    document.body.appendChild(d);
    requestAnimationFrame(function () { d.style.opacity = 1; });
    setTimeout(function () { d.style.opacity = 0; setTimeout(function () { d.remove(); }, 300); }, 2200);
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(lit)); } catch (e) {} }

  function paintProgress() {
    document.getElementById('pg').textContent = lit.length;
    document.getElementById('tt').textContent = NODES.length;
    document.querySelectorAll('.dot').forEach(function (el) {
      el.classList.toggle('lit', lit.indexOf(el.dataset.id) > -1);
    });
  }

  /* ---------- 地图 ---------- */
  (function buildMap() {
    var map = document.getElementById('map');
    var regions = [
      { t: '西 北', x: 14, y: 20 }, { t: '华 北', x: 52, y: 18 },
      { t: '华 东', x: 78, y: 42 }, { t: '西 南', x: 26, y: 84 },
      { t: '中 南', x: 62, y: 80 }
    ];
    regions.forEach(function (r) {
      var el = document.createElement('div');
      el.className = 'region';
      el.textContent = r.t;
      el.style.left = r.x + '%';
      el.style.top = r.y + '%';
      map.appendChild(el);
    });
    NODES.forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'dot';
      b.dataset.id = n.id;
      b.style.left = n.x + '%';
      b.style.top = n.y + '%';
      b.innerHTML = '<i></i><span>' + n.name.split(' · ')[1] + '</span>';
      b.onclick = function () { openNode(n.id); };
      map.appendChild(b);
    });
    paintProgress();
  })();

  /* ---------- 详情 ---------- */
  function openNode(id) {
    cur = NODES.filter(function (n) { return n.id === id; })[0];
    document.getElementById('d-name').textContent = cur.name;
    document.getElementById('d-theme').textContent = cur.theme + ' · ' + cur.folk;
    document.getElementById('d-intro').textContent = cur.intro;
    var c = cur.costume;
    document.getElementById('d-costume').innerHTML =
      '<div class="fig"></div>' +
      '<div><h3>' + c.title + '</h3>' +
      '<div class="chips">' + c.items.map(function (i) { return '<em>' + i + '</em>'; }).join('') + '</div>' +
      '<p>' + c.note + '</p></div>';
    go('s-detail');
  }

  /* ---------- 迁徙与融合 ---------- */
  function openHistory() {
    document.getElementById('h-name').textContent = cur.name + ' · ' + cur.theme;
    document.getElementById('h-video').textContent = cur.history.video;

    var pts = cur.history.sandbox.route;
    var d = 'M' + pts[0][0] * 3.4 + ' ' + pts[0][1] * 1.8;
    for (var i = 1; i < pts.length; i++) d += ' L' + pts[i][0] * 3.4 + ' ' + pts[i][1] * 1.8;
    var svg = '<rect x="0" y="0" width="340" height="180" fill="#FBFAF5"/>';
    svg += '<g stroke="#EDE9DE" stroke-width="0.5">';
    for (var k = 1; k < 6; k++) svg += '<line x1="0" y1="' + k * 30 + '" x2="340" y2="' + k * 30 + '"/>';
    for (var j = 1; j < 8; j++) svg += '<line x1="' + j * 42 + '" y1="0" x2="' + j * 42 + '" y2="180"/>';
    svg += '</g>';
    svg += '<path d="' + d + '" fill="none" stroke="#B08B4F" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>';
    pts.forEach(function (p, idx) {
      svg += '<circle cx="' + p[0] * 3.4 + '" cy="' + p[1] * 1.8 + '" r="' + (idx === 0 ? 6 : 4) + '" fill="' + (idx === 0 ? '#A33F1E' : '#B08B4F') + '"/>';
    });
    svg += '<circle r="4" fill="#fff" stroke="#A33F1E" stroke-width="2"><animateMotion dur="6s" repeatCount="indefinite" path="' + d + '"/></circle>';
    document.getElementById('h-sand').innerHTML = svg;
    document.getElementById('h-sandcap').textContent = cur.history.sandbox.caption;

    document.getElementById('h-comic').innerHTML = cur.history.comic.map(function (p) {
      return '<div class="panel"><div class="pic"></div><div class="txt"><span class="num">' + p.t + '</span><br>' + p.d + '</div></div>';
    }).join('');

    go('s-history');
  }

  /* ---------- 第一人称 ---------- */
  function startImmersive() {
    lineIdx = 0; seen = 0;
    document.getElementById('tip').classList.remove('on');
    document.querySelectorAll('.hotspot').forEach(function (h) { h.remove(); });
    document.getElementById('nextBtn').style.display = '';
    document.getElementById('say').textContent = cur.dialogue[0];
    go('s-imm');
  }

  function nextLine() {
    lineIdx++;
    if (lineIdx < cur.dialogue.length) {
      document.getElementById('say').textContent = cur.dialogue[lineIdx];
      if (lineIdx === cur.dialogue.length - 1) document.getElementById('nextBtn').textContent = '开始探索';
    } else {
      document.getElementById('nextBtn').style.display = 'none';
      document.getElementById('say').textContent = '场景里三个圆圈，点开看看。全部看过之后，我再问你一个问题。';
      spawnHotspots();
    }
  }

  function spawnHotspots() {
    var scene = document.getElementById('scene');
    cur.hotspots.forEach(function (h, i) {
      var el = document.createElement('button');
      el.className = 'hotspot show';
      el.textContent = i + 1;
      el.style.left = h.x + '%';
      el.style.top = h.y + '%';
      el.onclick = function () {
        if (!el.classList.contains('done')) { el.classList.add('done'); seen++; }
        var tip = document.getElementById('tip');
        tip.querySelector('h4').textContent = h.title;
        tip.querySelector('p').textContent = h.text;
        tip.classList.add('on');
        setTimeout(function () { tip.classList.remove('on'); }, 3800);
        if (seen === cur.hotspots.length) setTimeout(showQuiz, 1200);
      };
      scene.appendChild(el);
    });
  }

  /* ---------- 答题 ---------- */
  function showQuiz() {
    var q = cur.quiz;
    document.getElementById('q-text').textContent = q.q;
    document.getElementById('q-fb').classList.remove('on');
    document.getElementById('q-opts').innerHTML = q.opts.map(function (o, i) {
      return '<button class="opt" data-i="' + i + '">' + String.fromCharCode(65 + i) + '. ' + o + '</button>';
    }).join('');
    document.querySelectorAll('#q-opts .opt').forEach(function (b) {
      b.onclick = function () { answer(parseInt(b.dataset.i, 10)); };
    });
    document.getElementById('modal').classList.add('on');
  }

  function answer(i) {
    var q = cur.quiz, btns = document.querySelectorAll('#q-opts .opt');
    btns.forEach(function (b) { b.disabled = true; });
    if (i === q.answer) {
      btns[i].classList.add('right');
      var fb = document.getElementById('q-fb');
      fb.innerHTML = '<b>点亮。</b>' + q.tip;
      fb.classList.add('on');
      if (lit.indexOf(cur.id) < 0) lit.push(cur.id);
      save(); paintProgress();
      setTimeout(function () {
        document.getElementById('modal').classList.remove('on');
        if (lit.length === NODES.length) { finishAll(); } else { go('s-map'); }
      }, 1600);
    } else {
      btns[i].classList.add('wrong');
      var fb2 = document.getElementById('q-fb');
      fb2.textContent = '再想想。' + q.tip;
      fb2.classList.add('on');
      setTimeout(function () {
        btns.forEach(function (b) { b.disabled = false; b.classList.remove('wrong'); });
      }, 1200);
    }
  }

  function finishAll() {
    document.querySelector('#s-done h2').textContent = '十二个点，全部点亮';
    document.querySelector('#s-done p').textContent = '这里接后测量表与个人认知报告。';
    go('s-done');
  }

  function resetAll() {
    lit = []; save(); paintProgress(); go('s-map');
  }

  /* ---------- 视差 ---------- */
  (function parallax() {
    var scene = document.getElementById('scene');
    var far = document.getElementById('l-far'), mid = document.getElementById('l-mid'), near = document.getElementById('l-near');
    function move(cx, cy) {
      var r = scene.getBoundingClientRect();
      var dx = (cx - r.left) / r.width - .5, dy = (cy - r.top) / r.height - .5;
      far.style.transform = 'translate(' + (-dx * 8) + 'px,' + (-dy * 6) + 'px)';
      mid.style.transform = 'translate(' + (-dx * 20) + 'px,' + (-dy * 14) + 'px)';
      near.style.transform = 'translate(' + (-dx * 38) + 'px,' + (-dy * 24) + 'px)';
    }
    scene.addEventListener('mousemove', function (e) { move(e.clientX, e.clientY); });
    scene.addEventListener('touchmove', function (e) {
      if (e.touches[0]) move(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
  })();
</script>
</body>
</html>
